name: Nabhdrishti Aerospace
description: 'Nabhdrishti Aerospace is a Bangalore-based deep-tech startup building
  India''s first fuel-flex micro gas turbine for aviation and power generation. Its
  ND 400 engine is a 400 N single-core micro gas turbine designed for UAVs, hybrid-electric
  aircraft, and small aircraft as well as oil & gas, manufacturing, and vehicle range-extender
  power generation, running on conventional fuels, biofuels, and hydrogen with an
  innovative recuperator design that targets greater than 15% efficiency at under
  half the cost of competing turbines. Backed by Accel, the company raised USD 3M
  and operates from the IISc Bangalore IHUB. As a hardware manufacturer it publishes
  no public API, SDK, or developer platform; this profile tracks its public web presence.'
